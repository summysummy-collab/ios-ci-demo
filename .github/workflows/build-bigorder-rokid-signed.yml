name: build-bigorder-rokid-signed

# 在 public 仓库（免 CI 额度、日志可审计）里构建私有项目 bigorder-rokid 并签出可装机 ipa。
# 源码 checkout 到临时目录、ipa 直接传回私有仓库 Release：源码与产物都不留在本仓库。
#
# 与 build-bigorder-signed（bigorder-ios）的差别：
#   - 目标仓库是 bigorder-rokid（带乐奇眼镜副屏的那版）
#   - 无 CocoaPods、无外部 SDK，纯系统框架（Network / CoreImage / SwiftUI）
#   - 签名设置全部写在 project.yml 里，Archive 不再传命令行签名参数
#   - 产物按版本号命名，同版本重跑只覆盖，不堆垃圾资产
#
# ★ 复用 bigorder 描述文件（secret PROFILE_BIGORDER_B64），它绑定 com.bigorder.monitor。
#   bigorder-rokid 的 bundle id 没有改过，所以能直接对上，不需要构建期覆盖。
#   代价：装到真机会覆盖同名正式「大单监控」App，两者不能共存。
#   要独立安装，得为 com.bigorder.monitor.rokid 之类的新 App ID 建描述文件，
#   配成新 secret，并同步修改 project.yml 的 PRODUCT_BUNDLE_IDENTIFIER。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 私有仓库的分支名或 tag
        required: false
        default: main

# 去掉 concurrency：反复 dispatch 时它会把新 run 直接 cancel，
# 排队中的 job 反而更容易一直拿不到 runner。让每次运行独立排队。
permissions:
  contents: read # 本仓库只读；推 ipa 用 SRC_PAT 打到私有仓库，不走 GITHUB_TOKEN

env:
  SRC_REPO: summysummy-collab/bigorder-rokid
  # OTA 包（云同步凭证置空）与安装页都落在这个公开仓库
  OTA_REPO: summysummy-collab/ios-ci-demo
  PROJECT: BigOrderMonitor.xcodeproj
  SCHEME: BigOrderMonitor
  BUNDLE_ID: com.bigorder.monitor
  PROFILE_NAME: bigorder
  KEYCHAIN: build.keychain
  KC_PASS: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    # macos-15 是 arm64 runner，GitHub 明确提示过 arm64 池有容量瓶颈（排队久、易被取消）。
    # 改用同版本 macOS 15 的 Intel x64 池，绕开这个坑。
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: 拉取私有源码
        uses: actions/checkout@v4
        with:
          repository: summysummy-collab/bigorder-rokid
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.SRC_PAT }}
          path: src
          persist-credentials: false # 别把 token 写进 .git/config

      - name: 选择最新 Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $(basename "$XCODE_APP")"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: 安装 XcodeGen 并生成工程
        working-directory: src
        env:
          BOCOS_AK: ${{ secrets.BOCOS_AK }}
          BOCOS_SK: ${{ secrets.BOCOS_SK }}
        run: |
          set -euo pipefail
          brew install xcodegen
          # ipa 落在私有仓库 Release，凭证按真值注入，装到手机上云同步可用。
          # 注意 Config/Secrets.xcconfig 的 #include? 在末尾，这里只写 AK/SK。
          mkdir -p Config
          {
            echo "BOCOS_AK=${BOCOS_AK}"
            echo "BOCOS_SK=${BOCOS_SK}"
          } > Config/Secrets.local.xcconfig
          if [ -z "${BOCOS_AK}" ]; then
            echo "::warning::未配置 BOCOS_AK/BOCOS_SK，本次包的云同步将不可用（不影响出包）"
          fi
          xcodegen generate
          test -d "$PROJECT" || { echo "::error::xcodegen 未生成工程"; exit 1; }

          # 版本号从 settings.base 读（唯一的真源）；Info.plist 段是 $(MARKETING_VERSION)，
          # 所以不能再去 grep CFBundleShortVersionString —— 那样只会拿到变量名。
          # 锚定行首，避免匹配到注释里提到的名字。
          VER=$(grep -m1 -E '^[[:space:]]+MARKETING_VERSION:' project.yml | sed -E 's/.*: *"?([0-9][0-9.]*)"?.*/\1/')
          BUILD=$(grep -m1 -E '^[[:space:]]+CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*: *"?([0-9]+)"?.*/\1/')
          [ -n "$VER" ] && [ -n "$BUILD" ] || { echo "::error::读不到版本号（project.yml 的 MARKETING_VERSION / CURRENT_PROJECT_VERSION）"; exit 1; }
          echo "APP_VER=${VER}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${BUILD}" >> "$GITHUB_ENV"
          echo "版本: ${VER} (${BUILD})"

      # 智能体和 ipa 是两套东西：ipa 装手机，.aix 装眼镜。一起发到同一个 Release，
      # 免得「装了 App 忘了装智能体」。
      - name: 打包眼镜端智能体（.aix）
        working-directory: src/aiui-agent
        run: |
          set -euo pipefail
          # 官方 CLI，纯 Node 实现（无平台二进制），macOS runner 直接跑
          npm install -g @yodaos-pkg/aix-cli > /dev/null
          test -f .aixignore || { echo "::error::缺 .aixignore，打包会把 tools/ 和冗余 vendor 一起塞进去"; exit 1; }

          # 智能体有自己的版本号（源码常量），和 App 版本解耦：
          # 眼镜端顶栏显示它、也拿它比「有没有新版」，所以清单里的 agent.version 必须是它。
          # 从源码读而不是手填，省得改了代码忘了改文档。
          AGENT_VER=$(sed -n "s/.*AGENT_VERSION = '\([0-9.]*\)'.*/\1/p" lib/version.js | head -1)
          [ -n "$AGENT_VER" ] || { echo "::error::lib/version.js 里没解析到 AGENT_VERSION"; exit 1; }
          echo "智能体版本：${AGENT_VER}（App ${APP_VER} b${APP_BUILD}）"

          AIX_NAME="aiui-agent-rokid-${AGENT_VER}-b${APP_BUILD}.aix"
          ZIP_NAME="aiui-agent-rokid-src-${APP_VER}-b${APP_BUILD}.zip"
          aix pack . -o "$RUNNER_TEMP/$AIX_NAME" > pack.log 2>&1 || {
            echo "::error::aix pack 失败"; tail -20 pack.log; exit 1; }
          tail -2 pack.log

          # 断言包内容。这几条对应真机上会直接崩的三个点：
          #   pages/*.ink 缺了 → 智能体没有页面
          #   lib/*.js 缺了 → 行情和大单全废
          #   sample.js 缺了 → 没连手机时又退回一整屏空白（只是不再报错）
          #   vendor/webpjs 缺了 → 扫码解码挂掉（webp.js 把它当字符串内联）
          aix list "$RUNNER_TEMP/$AIX_NAME" > list.txt
          for f in app.json app.js AGENTS.md pages/quotes/index.ink pages/scan/index.ink \
                   lib/market.js lib/hud.js lib/bridge.js lib/version.js lib/webp.js \
                   lib/sample.js lib/vendor/webpjs/webpjs.source.js; do
            grep -q "^$f:" list.txt || { echo "::error::智能体包缺 $f"; exit 1; }
          done
          if grep -q '^tools/' list.txt; then
            echo "::error::智能体包里混进了 tools/（.aixignore 未生效）"; exit 1
          fi
          echo "智能体包就绪：${AIX_NAME}（$(du -h "$RUNNER_TEMP/$AIX_NAME" | cut -f1)）"

          # 源码 zip 便于人工审查 / 本地导入；.aix 是 CLI 的本地状态，不进包
          cd ..
          zip -q -r "$RUNNER_TEMP/$ZIP_NAME" aiui-agent \
            -x 'aiui-agent/.aix/*' 'aiui-agent/*.log'
          echo "源码包就绪：$ZIP_NAME"

          echo "AGENT_FILE=$AIX_NAME" >> "$GITHUB_ENV"
          echo "AGENT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "AGENT_VERSION=$AGENT_VER" >> "$GITHUB_ENV"
          # 体积进安装页的 chips，所以这里就得算好。
          # 拆成两行：macOS 自带的 bash 3.2 对 "$(cmd "$var")" 这种嵌套引号不总是稳。
          AGENT_BYTES=$(stat -f%z "$RUNNER_TEMP/$AIX_NAME")
          echo "AGENT_SIZE=$AGENT_BYTES" >> "$GITHUB_ENV"

      # 所有打印都刻意不输出证书 CN / TeamID / 描述文件 UUID / 设备列表：
      # 本仓库日志对全网公开。完整编译日志可用带认证的 Actions API 在本地拉取分析。
      - name: 导入签名证书
        env:
          CERT_B64: ${{ secrets.CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_B64" | openssl base64 -d -A -out "$CERT_PATH"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          rm -f "$CERT_PATH"

          N=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Development" || true)
          echo "可用 Apple Development 身份数: $N"
          [ "$N" -ge 1 ] || { echo "::error::钥匙串里没有 Apple Development 身份"; exit 1; }

      - name: 安装描述文件
        env:
          PROFILE_B64: ${{ secrets.PROFILE_BIGORDER_B64 }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_B64" | openssl base64 -d -A -out "$PROFILE"

          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)
          NAME=$(security cms -D -i "$PROFILE" | plutil -extract Name raw -o - -)
          BID=$(security cms -D -i "$PROFILE" | plutil -extract Entitlements.application-identifier raw -o - -)

          # 描述文件的 App ID 必须与工程一致，否则 Manual 签名会在 Archive 末尾才失败，
          # 白等十几分钟编译。这里提前拦住。
          case "$BID" in
            *".$BUNDLE_ID") echo "描述文件匹配 $BUNDLE_ID" ;;
            *) echo "::error::描述文件的 App ID（${BID}）与 $BUNDLE_ID 不一致"; exit 1 ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          # set -u 下 `$NAME（` 会把全角括号算进变量名 → unbound variable，必须用 ${}
          echo "描述文件已安装：${NAME}（UUID 不打印）"

          # 安装页要展示「N 台已登记 / 描述文件哪天到期」，这两项从描述文件直接读，
          # 不手写在页面里，换描述文件后自动跟着变。只输出数量，不输出 UDID。
          echo "PROFILE_NAME=${NAME}" >> "$GITHUB_ENV"
          EXPIRES=$(security cms -D -i "$PROFILE" | plutil -extract ExpirationDate raw -o - - | cut -c1-10)
          echo "PROFILE_EXPIRES=${EXPIRES}" >> "$GITHUB_ENV"
          DEVS_JSON=$(security cms -D -i "$PROFILE" | plutil -extract ProvisionedDevices json -o - - 2>/dev/null || echo '[]')
          DEVICES=$(printf '%s' "$DEVS_JSON" | jq 'length' 2>/dev/null || echo 0)
          echo "DEVICES=${DEVICES}" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: src
        run: |
          set -o pipefail
          set +e
          # 签名设置（DEVELOPMENT_TEAM / Manual / Apple Development / profile=bigorder）
          # 全部在 project.yml 里，命令行不再传，避免与工程配置打架。
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/BigOrderMonitor.xcarchive archive > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::归档失败（日志已脱敏，仅输出出错位置）"
            echo "错误总数: $(grep -c 'error:' build.log || echo 0)"
            grep -oE '[^ /]+\.(swift|m|h):[0-9]+:[0-9]+: error' build.log | sort -u | head -25 || true
            # 签名类错误没有文件名前缀，单独捞几行，便于判断是证书还是 profile 的问题
            grep -iE "provisioning profile|does not match|no signing certificate|requires a development team" \
              build.log | head -6 || true
            rm -f build.log
            exit 1
          fi
          rm -f build.log
          echo "归档通过"

      - name: Export ipa
        working-directory: src
        env:
          # Team ID 走 secret，不写进这个公开文件
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          set -u
          [ -n "${TEAM_ID:-}" ] || { echo "::error::缺少 secret APPLE_TEAM_ID"; exit 1; }
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/BigOrderMonitor.xcarchive \
            -exportPath build -exportOptionsPlist exportOptions.plist > export.log 2>&1 || {
              echo "::error::导出失败"; tail -20 export.log; exit 1; }
          ls -lh build/*.ipa
          echo "sha256: $(shasum -a 256 build/*.ipa | cut -d' ' -f1)"

      - name: 校验签名与关键配置
        working-directory: src
        run: |
          set -euo pipefail
          rm -rf chk && mkdir chk && cd chk
          unzip -q ../build/*.ipa
          APP=$(find Payload -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --strict --verbose=2 "$APP" 2>&1 | tail -3
          test -f "$APP/embedded.mobileprovision" || { echo "::error::包内缺描述文件"; exit 1; }

          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          [ "$BID" = "$BUNDLE_ID" ] || { echo "::error::Bundle ID 是 ${BID}，应为 $BUNDLE_ID"; exit 1; }

          # 包里的版本必须和工程配置一致：project.yml 曾经在 Info.plist 段另写了一份
          # 2.6.1，Info.plist 的值优先，改了 MARKETING_VERSION 也出不来新版本号，
          # 结果是「代码是新的、版本号还是旧的」，安装页和眼镜端的升级提示都跟着错。
          PKG_VER=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          PKG_BLD=$(plutil -extract CFBundleVersion raw "$APP/Info.plist")
          [ "$PKG_VER" = "$APP_VER" ] && [ "$PKG_BLD" = "$APP_BUILD" ] \
            || { echo "::error::包内版本 ${PKG_VER}(${PKG_BLD}) 与工程配置 ${APP_VER}(${APP_BUILD}) 不一致"; exit 1; }
          echo "包内版本: ${PKG_VER} (${PKG_BLD})"

          # 眼镜行情桥靠局域网 http://<手机>:8788；iOS 14+ 缺这条说明，真机上
          # 本地网络权限弹窗不出现、桥永远连不上，而编译阶段完全不报错。
          plutil -extract NSLocalNetworkUsageDescription raw "$APP/Info.plist" > /dev/null 2>&1 \
            || { echo "::error::包内缺 NSLocalNetworkUsageDescription，眼镜端将无法发现手机"; exit 1; }
          # App Transport Security 必须放行 http，否则 /health 直接被系统拦掉
          plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw "$APP/Info.plist" | grep -qx true \
            || echo "::warning::NSAllowsArbitraryLoads 不为 true，眼镜可能连不上桥"

          echo "Bundle ID: $BID · 落网权限已声明"
          echo "体积: $(du -sh "$APP" | cut -f1)"
          # 只报数量不报 UDID。注意两点坑：
          #   1) `plutil` 不接受 `-` 当输入文件，管道喂进去必然失败，只能用真文件
          #   2) 老写法 `grep -o '"' | wc -l` 在提取失败时被 2>/dev/null 吞掉，静默算出 0，
          #      看着像「一台设备都装不了」。这里失败就明说，不猜。
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          if DEV=$(python3 -c 'import plistlib,sys; d=plistlib.load(open(sys.argv[1],"rb")); v=d.get("ProvisionedDevices"); print(len(v) if v else "不限（非 development 描述文件）")' "$RUNNER_TEMP/profile.plist" 2>/dev/null) && [ -n "$DEV" ]; then
            echo "登记设备数: $DEV"
          else
            echo "::warning::无法从描述文件统计登记设备数（不影响 ipa 本身）"
          fi

      # ipa 不落到本仓库的 Release/artifact（public 全网可下载），
      # 走 SRC_PAT 传到私有仓库的 ci-signed，下载仍需登录授权。
      - name: 传到私有仓库 Release
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.SRC_PAT }}
        run: |
          set -euo pipefail
          IPA=$(ls build/*.ipa | head -1)
          OUT="BigOrderMonitor-rokid-${APP_VER}-b${APP_BUILD}.ipa"
          cp "$IPA" "$RUNNER_TEMP/$OUT"
          gh release view ci-signed -R "$SRC_REPO" > /dev/null 2>&1 \
            || gh release create ci-signed -R "$SRC_REPO" \
                 --title "CI 已签名包（自动覆盖）" --notes "由 public 仓库 Actions 构建" > /dev/null
          gh release upload ci-signed "$RUNNER_TEMP/$OUT" "$RUNNER_TEMP/$AGENT_FILE" \
            "$RUNNER_TEMP/$AGENT_ZIP" -R "$SRC_REPO" --clobber
          echo "已上传 $OUT / $AGENT_FILE / $AGENT_ZIP 到 $SRC_REPO Release ci-signed"

      # ── OTA 专用版 ────────────────────────────────────────────────────────────
      # ipa 的 Info.plist 里带着明文云同步凭证（BOCosAK/BOCosSK）。放在私有 Release
      # 没问题，但 OTA 安装要求 ipa 能被手机匿名 GET —— 一旦公开就等于公开密钥。
      # 所以这里重编一次：删掉本地 Secrets.local.xcconfig，#include? 退化成空占位，
      # 凭证变成空字符串。代价是 OTA 版没有云同步，其余功能完全一致。
      - name: OTA 版：去掉云同步凭证并重新归档
        working-directory: src
        run: |
          set -euo pipefail
          # xcconfig 是「后赋值覆盖前赋值」，#include? 在文件末尾，删掉 local 文件即回到空占位。
          # 先确认这个结构没变，否则置空会静默失效、凭证照样打进包里。
          grep -q '#include? "Secrets.local.xcconfig"' Config/Secrets.xcconfig \
            || { echo "::error::Secrets.xcconfig 的 include 结构变了，置空方案失效，拒绝继续"; exit 1; }
          rm -f Config/Secrets.local.xcconfig

          rm -rf build-ota && mkdir -p build-ota
          set +e
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build-ota/ota.xcarchive archive > build-ota.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::OTA 版归档失败"
            grep -oE '[^ /]+\.(swift|m|h):[0-9]+:[0-9]+: error' build-ota.log | sort -u | head -20 || true
            rm -f build-ota.log
            exit 1
          fi
          rm -f build-ota.log
          echo "OTA 版归档通过"

      - name: OTA 版：导出并校验凭证已清空
        working-directory: src
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath build-ota/ota.xcarchive \
            -exportPath build-ota -exportOptionsPlist exportOptions.plist > export-ota.log 2>&1 || {
              echo "::error::OTA 版导出失败"; tail -20 export-ota.log; exit 1; }
          IPA=$(ls "$PWD"/build-ota/*.ipa | head -1)
          ls -lh "$IPA"

          rm -rf chk-ota && mkdir chk-ota && cd chk-ota
          unzip -q "$IPA"
          APP=$(find Payload -maxdepth 1 -name "*.app" | head -1)

          # 硬护栏：这两个值为空才允许上传到公开位置。宁可让 CI 红一次，
          # 也不能把带真实密钥的包推到全网可下载的 Release。
          AK=$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb")).get("BOCosAK","") or "")' "$APP/Info.plist")
          SK=$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb")).get("BOCosSK","") or "")' "$APP/Info.plist")
          if [ -n "$AK" ] || [ -n "$SK" ]; then
            echo "::error::OTA 包里的云同步凭证没被清空（AK 长度 ${#AK}），拒绝上传公开仓库"
            exit 1
          fi
          echo "护栏通过：BOCosAK / BOCosSK 均为空"

          codesign --verify --strict --verbose=2 "$APP" 2>&1 | tail -2
          echo "OTA 版体积: $(du -sh "$APP" | cut -f1)"

      - name: OTA 版：上传公开 Release
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.SRC_PAT }}
        run: |
          set -euo pipefail
          IPA=$(ls "$PWD"/build-ota/*.ipa | head -1)
          OTA_NAME="BigOrderMonitor-rokid-ota-${APP_VER}-b${APP_BUILD}.ipa"
          cp "$IPA" "$RUNNER_TEMP/$OTA_NAME"

          echo "OTA_FILE=$OTA_NAME" >> "$GITHUB_ENV"
          echo "OTA_SIZE=$(stat -f%z "$RUNNER_TEMP/$OTA_NAME")" >> "$GITHUB_ENV"
          echo "OTA_SHA=$(shasum -a 256 "$RUNNER_TEMP/$OTA_NAME" | cut -d' ' -f1)" >> "$GITHUB_ENV"

          gh release view ota -R "$OTA_REPO" > /dev/null 2>&1 \
            || gh release create ota -R "$OTA_REPO" --title "OTA 测试版（公开分发）" \
                 --notes "OTA 专用包：云同步凭证已置空，其余功能与完整版一致。完整版见各自私有仓库的 ci-signed。" > /dev/null
          # 只留最新一个：清掉同名前缀的旧包，避免 Release 里堆一长串过期 ipa
          OLD=$(gh release view ota -R "$OTA_REPO" --json assets -q '.assets[].name' 2>/dev/null \
                | grep -E '^BigOrderMonitor-rokid-ota-' || true)
          for n in $OLD; do
            gh release delete-asset ota "$n" -R "$OTA_REPO" --yes > /dev/null 2>&1 || true
          done
          gh release upload ota "$RUNNER_TEMP/$OTA_NAME" -R "$OTA_REPO" --clobber
          echo "已上传 $OTA_NAME 到 $OTA_REPO Release ota"

      - name: OTA 版：更新安装页与 manifest
        env:
          GH_TOKEN: ${{ secrets.SRC_PAT }}
        run: |
          set -euo pipefail
          SLUG=bigorder-rokid
          SITE="$RUNNER_TEMP/site"
          IPA_URL="https://github.com/${OTA_REPO}/releases/download/ota/${OTA_FILE}"

          rm -rf "$SITE"
          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OTA_REPO}.git" "$SITE"
          cd "$SITE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "docs/$SLUG"

          # 清单与 manifest.plist 都由 tools/ota_json.py 生成（脚本随站点一起提交）。
          # 抽成脚本的原因：jq 表达式和手拼 XML 都只能在 CI 里试错，这个本地能跑。
          # 它读同目录的 notes.json 取发版说明，并把上一条 latest 挤进 history（最多 8 条）。
          python3 tools/ota_json.py --site docs --slug "$SLUG" \
            --name "大单监控 · 乐奇版" --label "乐奇版" \
            --subtitle "自选股盯盘 + 乐奇眼镜副屏" \
            --bundle-id "$BUNDLE_ID" --version "$APP_VER" --build "$APP_BUILD" \
            --ipa-url "$IPA_URL" --size "${OTA_SIZE:-0}" --sha256 "$OTA_SHA" \
            --profile-name "${PROFILE_NAME:-bigorder}" --devices "${DEVICES:-0}" \
            --expires "${PROFILE_EXPIRES:-}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --agent-file "$AGENT_FILE" --agent-size "${AGENT_SIZE:-0}" \
            --agent-version "${AGENT_VERSION:-}" \
            --agent-url "https://github.com/${SRC_REPO}/releases/tag/ci-signed" \
            --agent-notes "眼镜端界面、扫码导入、切股逻辑全在智能体里，ipa 只负责喂数据,顶栏常显版本号，比远端旧时底栏提示可升级,装法：aix install 之后必须用 aix launch-page 带上 pages/quotes/index 拉起，否则可能落到别的页面"

          # 站点是 main/docs，GitHub Pages 直接吃这个目录；所有包共用一张总览页，
          # 每个包只往自己的子目录写 ota.json + manifest.plist。
          git add "docs/$SLUG"
          if git diff --cached --quiet; then
            echo "站点内容无变化，跳过提交"
          else
            git commit -q -m "chore(ota): bigorder-rokid ${APP_VER} (b${APP_BUILD}) [skip ci]"
            pushed=0
            for i in 1 2 3; do
              if git push --quiet origin HEAD:main; then pushed=1; break; fi
              echo "推送冲突，rebase 后重试（第 $i 次）"
              git pull --rebase --quiet origin main || true
            done
            [ "$pushed" = "1" ] || { echo "::error::安装页推送失败，可能被并发构建抢占"; exit 1; }
            echo "安装页已更新：https://${OTA_REPO%%/*}.github.io/${OTA_REPO##*/}/"
          fi

      - name: 摘要
        if: always()
        run: |
          {
            echo "## bigorder-rokid 签名包"
            echo ""
            echo "- 版本：\`${APP_VER:-?}\` (build \`${APP_BUILD:-?}\`)"
            echo "- 源码：私有仓库 \`$SRC_REPO\`（临时目录 checkout，源码不进公开日志）"
            echo "- 签名：development 描述文件 \`$PROFILE_NAME\`，bundle id \`$BUNDLE_ID\`"
            echo ""
            echo "### 产物"
            echo ""
            echo "| 内容 | 位置 | 能不能公开 |"
            echo "|---|---|---|"
            echo "| ipa（含云同步凭证） | \`$SRC_REPO\` Release \`ci-signed\` | 否，私有 |"
            echo "| 智能体 \`.aix\` | \`$SRC_REPO\` Release \`ci-signed\` | 否，私有 |"
            echo "| 智能体源码 \`.zip\` | \`$SRC_REPO\` Release \`ci-signed\` | 否，私有 |"
            echo "| ipa（凭证已置空） | OTA Release \`ota\` | 是，供安装页 |"
            echo ""
            echo "- 眼镜端智能体：\`${AGENT_FILE:-（未打包）}\`，装完 App 后在「设置 → 眼镜副屏」配对"
            echo "- OTA 安装页：https://${OTA_REPO%%/*}.github.io/${OTA_REPO##*/}/"
            echo "- ⚠️ bundle id 与正式「大单监控」相同，装上会覆盖原 App"
            echo "- ⚠️ OTA 版云同步不可用；要云同步请用私有 Release 的完整版"
          } >> "$GITHUB_STEP_SUMMARY"
