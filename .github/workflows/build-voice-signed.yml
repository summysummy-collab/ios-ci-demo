name: build-voice-signed

# 同传（voice-interpreter）签名构建，跑在 public 仓库（免额度）。
# 私有源码每次 checkout 到临时目录；ipa 直接传私有仓库 Release，本仓库不留产物。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 私有仓库的分支名或 tag
        required: false
        default: main

concurrency:
  group: voice-signed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SRC_REPO: summysummy-collab/voice-interpreter
  KEYCHAIN: build.keychain
  KC_PASS: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: 拉取私有源码
        uses: actions/checkout@v4
        with:
          repository: summysummy-collab/voice-interpreter
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SRC_PAT }}
          path: src
          persist-credentials: false

      - name: 缓存端上模型
        uses: actions/cache@v4
        with:
          path: |
            src/VoiceInterp/asr-model
            src/VoiceInterp/speaker-model
          key: ondevice-models-v4-asr-zh-en-campplus

      - name: 准备端上模型
        working-directory: src
        run: bash tools/prepare_model.sh

      - name: 选择 Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::镜像里没有 Xcode 26，iOS 26 SDK 不可用"
            exit 1
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: 安装 XcodeGen 并生成工程
        working-directory: src
        env:
          TC_ASR_SID: ${{ secrets.TC_ASR_SID }}
          TC_ASR_SKEY: ${{ secrets.TC_ASR_SKEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          brew install xcodegen
          mkdir -p Config
          {
            echo "TC_ASR_SID=${TC_ASR_SID}"
            echo "TC_ASR_SKEY=${TC_ASR_SKEY}"
            echo "QWEN_API_KEY=${QWEN_API_KEY}"
          } > Config/Secrets.local.xcconfig
          if [ -z "${TC_ASR_SID}" ] || [ -z "${QWEN_API_KEY}" ]; then
            echo "::warning::TC_ASR_SID / QWEN_API_KEY 未配置，本次包的云端精修不可用（不影响出包）"
          fi
          xcodegen generate

      # ---- 签名材料：不打印证书 CN / TeamID / 描述文件 UUID / 设备编号，日志对全网公开
      - name: 导入签名证书
        env:
          CERT_B64: ${{ secrets.CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_B64" | openssl base64 -d -A -out "$CERT_PATH"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          rm -f "$CERT_PATH"

          N=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Development" || true)
          echo "可用 Apple Development 身份数: $N"
          [ "$N" -ge 1 ] || { echo "::error::钥匙串里没有 Apple Development 身份"; exit 1; }

      - name: 安装描述文件
        env:
          PROFILE_B64: ${{ secrets.PROFILE_TRANSTOME_B64 }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_B64" | openssl base64 -d -A -out "$PROFILE"

          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          # entitlements 直接从描述文件里抠，保证和苹果签发的完全一致
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          plutil -extract Entitlements xml1 -o "$RUNNER_TEMP/entitlements.plist" "$RUNNER_TEMP/profile.plist"
          echo "描述文件已安装（UUID / 设备列表不打印）"

      - name: 编译（真机 arm64，先不签名）
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild \
            -project VoiceInterp.xcodeproj \
            -scheme VoiceInterp \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            build

      - name: 手工签名
        working-directory: src
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app 已生成"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Apple Development: [^"]*\)"/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "::error::钥匙串里没有 Apple Development 身份"; exit 1; }

          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"

          sign() {
            codesign --force --timestamp=none --generate-entitlement-der \
              --sign "$IDENTITY" "$@" 2>/dev/null \
            || codesign --force --timestamp=none --sign "$IDENTITY" "$@"
          }

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 2 \( -name "*.framework" -o -name "*.dylib" \) -print0 \
              | while IFS= read -r -d '' item; do sign --entitlements "$RUNNER_TEMP/entitlements.plist" "$item"; done
          fi
          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -maxdepth 1 -name "*.appex" -print0 \
              | while IFS= read -r -d '' ext; do sign --entitlements "$RUNNER_TEMP/entitlements.plist" "$ext"; done
          fi
          sign --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP"
          echo "签名完成"

      - name: 校验签名并打包
        working-directory: src
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --strict --verbose=2 "$APP" 2>&1 | tail -2

          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          echo "Bundle ID: $BID"
          case "$BID" in
            com.fieldtranstome.auto) ;;
            *) echo "::error::Bundle ID 与描述文件不匹配：$BID"; exit 1 ;;
          esac
          test -f "$APP/embedded.mobileprovision" || { echo "::error::包内没有 embedded.mobileprovision"; exit 1; }

          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../VoiceInterp-signed.ipa Payload
          cd ..
          ls -lh VoiceInterp-signed.ipa
          echo "sha256: $(shasum -a 256 VoiceInterp-signed.ipa | cut -d' ' -f1)"

      - name: 传到私有仓库 Release
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.SRC_PAT }}
        run: |
          set -euo pipefail
          gh release view ci-signed -R "$SRC_REPO" > /dev/null 2>&1 \
            || gh release create ci-signed -R "$SRC_REPO" \
                 --title "CI 已签名包（自动覆盖）" --notes "由 public 仓库 Actions 构建" > /dev/null
          gh release upload ci-signed VoiceInterp-signed.ipa -R "$SRC_REPO" --clobber
          echo "已上传 VoiceInterp-signed.ipa 到 $SRC_REPO Release ci-signed"

      - name: 摘要
        if: always()
        run: |
          {
            echo "## 同传 签名包"
            echo ""
            echo "- 构建方式：public 仓库 Actions（不占私有仓库额度）"
            echo "- 产物去向：私有仓库 \`$SRC_REPO\` 的 Release \`ci-signed\`"
            echo "- Bundle ID：\`com.fieldtranstome.auto\`"
          } >> "$GITHUB_STEP_SUMMARY"
