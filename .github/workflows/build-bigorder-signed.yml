name: build-bigorder-signed

# 在 public 仓库（免额度）里构建私有项目并签出可装机 ipa。
# 源码与产物都不留在本仓库：源码 checkout 到临时目录，ipa 直接传到私有仓库的 Release。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 私有仓库的分支名或 tag
        required: false
        default: main

concurrency:
  group: bigorder-signed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 本仓库只读；推 ipa 用 SRC_PAT 打到私有仓库，不走 GITHUB_TOKEN

env:
  SRC_REPO: summysummy-collab/bigorder-ios
  # OTA 包（云同步凭证置空）与安装页都落在这个公开仓库
  OTA_REPO: summysummy-collab/ios-ci-demo
  PROJECT: BigOrderMonitor.xcodeproj
  SCHEME: BigOrderMonitor
  BUNDLE_ID: com.bigorder.monitor
  PROFILE_NAME: bigorder
  KEYCHAIN: build.keychain
  KC_PASS: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    # macos-15 是 arm64 池，排队长且容易被取消；走 Intel x64 池稳定得多
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: 拉取私有源码
        uses: actions/checkout@v4
        with:
          repository: summysummy-collab/bigorder-ios
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SRC_PAT }}
          path: src
          persist-credentials: false # 别把 token 写进 .git/config，免得后续步骤能读到

      - name: 选择最新 Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $(basename "$XCODE_APP")"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: 安装 XcodeGen 并生成工程
        working-directory: src
        env:
          BOCOS_AK: ${{ secrets.BOCOS_AK }}
          BOCOS_SK: ${{ secrets.BOCOS_SK }}
        run: |
          brew install xcodegen
          # 构建期注入云同步凭证；没配就写空值，让 App 走「云同步不可用」分支，不影响出包
          mkdir -p Config
          {
            echo "BOCOS_AK=${BOCOS_AK}"
            echo "BOCOS_SK=${BOCOS_SK}"
          } > Config/Secrets.local.xcconfig
          if [ -z "${BOCOS_AK}" ]; then
            echo "::warning::未配置 BOCOS_AK/BOCOS_SK，本次包的云同步将不可用（不影响出包）"
          fi
          xcodegen generate
          test -d "$PROJECT" || { echo "::error::xcodegen 未生成工程"; exit 1; }

          # 版本号从工程配置读，产物命名和 OTA 页都用它，避免和 project.yml 走神
          VER=$(grep -m1 'CFBundleShortVersionString' project.yml | sed -E 's/.*: *"([^"]+)".*/\1/')
          BUILD=$(grep -m1 'CFBundleVersion' project.yml | sed -E 's/.*: *"([^"]+)".*/\1/')
          echo "APP_VER=${VER}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${BUILD}" >> "$GITHUB_ENV"
          echo "版本: ${VER} (${BUILD})"

      # ---- 签名材料。所有打印都刻意不输出证书 CN / TeamID / 描述文件 UUID / 设备列表，
      #     因为本仓库的日志对全网公开。只输出「成功/失败」和数量。
      - name: 导入签名证书
        env:
          CERT_B64: ${{ secrets.CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_B64" | openssl base64 -d -A -out "$CERT_PATH"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          rm -f "$CERT_PATH"

          N=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Development" || true)
          echo "可用 Apple Development 身份数: $N"
          [ "$N" -ge 1 ] || { echo "::error::钥匙串里没有 Apple Development 身份"; exit 1; }

      - name: 安装描述文件
        env:
          PROFILE_B64: ${{ secrets.PROFILE_BIGORDER_B64 }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_B64" | openssl base64 -d -A -out "$PROFILE"

          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "描述文件已安装（UUID 不打印）"

          # 安装页要写「N 台已登记 / 哪天到期」，这两项直接从描述文件读，
          # 换描述文件后页面自动跟着变。只输出数量，不输出 UDID。
          EXPIRES=$(security cms -D -i "$PROFILE" | plutil -extract ExpirationDate raw -o - - | cut -c1-10)
          echo "PROFILE_EXPIRES=${EXPIRES}" >> "$GITHUB_ENV"
          DEVS_JSON=$(security cms -D -i "$PROFILE" | plutil -extract ProvisionedDevices json -o - - 2>/dev/null || echo '[]')
          DEVICES=$(printf '%s' "$DEVS_JSON" | jq 'length' 2>/dev/null || echo 0)
          echo "DEVICES=${DEVICES}" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: src
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          set +e
          xcodebuild -project BigOrderMonitor.xcodeproj -scheme BigOrderMonitor \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/BigOrderMonitor.xcarchive archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER=bigorder > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::归档失败（日志已脱敏，仅输出出错位置）"
            echo "错误总数: $(grep -c 'error:' build.log || echo 0)"
            grep -oE '[^ /]+\.(swift|m|mm|h|c|cc|cpp):[0-9]+:[0-9]+: error' build.log \
              | sort -u | head -25 || true
            rm -f build.log
            exit 1
          fi
          rm -f build.log
          echo "归档通过"

      - name: Export ipa
        working-directory: src
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bigorder.monitor</key><string>bigorder</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/BigOrderMonitor.xcarchive \
            -exportPath build -exportOptionsPlist exportOptions.plist > export.log 2>&1 || {
              echo "::error::导出失败"; tail -20 export.log; exit 1; }
          ls -lh build/*.ipa
          echo "sha256: $(shasum -a 256 build/*.ipa | cut -d' ' -f1)"

      - name: 校验签名
        working-directory: src
        run: |
          set -euo pipefail
          rm -rf chk && mkdir chk && cd chk
          unzip -q ../build/*.ipa
          APP=$(find Payload -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --strict --verbose=2 "$APP" 2>&1 | tail -3
          test -f "$APP/embedded.mobileprovision" || { echo "::error::包内缺描述文件"; exit 1; }
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          [ "$BID" = "$BUNDLE_ID" ] || { echo "::error::Bundle ID 是 ${BID}，应为 $BUNDLE_ID"; exit 1; }
          echo "Bundle ID: $BID"
          echo "体积: $(du -sh "$APP" | cut -f1)"
          # 只报数量不报 UDID。两个坑：plutil 不接受 `-` 当输入文件；
          # 老写法 `grep -o '"' | wc -l` 在提取失败时被 2>/dev/null 吞掉、静默算出 0。
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          if DEV=$(python3 -c 'import plistlib,sys; d=plistlib.load(open(sys.argv[1],"rb")); v=d.get("ProvisionedDevices"); print(len(v) if v else "不限（非 development 描述文件）")' "$RUNNER_TEMP/profile.plist" 2>/dev/null) && [ -n "$DEV" ]; then
            echo "登记设备数: $DEV"
          else
            echo "::warning::无法从描述文件统计登记设备数（不影响 ipa 本身）"
          fi

      # ipa 里有明文云同步凭证，绝不能放到本仓库的 Release/artifact —— 那对全网可下载。
      # 走 SRC_PAT 传到私有仓库的 ci-signed，下载仍需登录授权。
      - name: 传到私有仓库 Release
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.SRC_PAT }}
        run: |
          set -euo pipefail
          IPA=$(ls build/*.ipa | head -1)
          OUT="BigOrderMonitor-${APP_VER}-b${APP_BUILD}.ipa"
          cp "$IPA" "$RUNNER_TEMP/$OUT"
          gh release view ci-signed -R "$SRC_REPO" > /dev/null 2>&1 \
            || gh release create ci-signed -R "$SRC_REPO" \
                 --title "CI 已签名包（自动覆盖）" --notes "由 public 仓库 Actions 构建" > /dev/null
          # 早期版本直接传的是 BigOrderMonitor.ipa（无版本号），清掉免得和新包混淆
          gh release delete-asset ci-signed "BigOrderMonitor.ipa" -R "$SRC_REPO" --yes > /dev/null 2>&1 || true
          gh release upload ci-signed "$RUNNER_TEMP/$OUT" -R "$SRC_REPO" --clobber
          echo "已上传 $OUT 到 $SRC_REPO Release ci-signed"

      # ── OTA 专用版 ────────────────────────────────────────────────────────────
      # ipa 的 Info.plist 带着明文云同步凭证（BOCosAK/BOCosSK）。私有 Release 无所谓，
      # 但 OTA 要求 ipa 能被手机匿名 GET，公开就等于公开密钥。所以重编一次：
      # 删掉本地 Secrets.local.xcconfig，#include? 退化成空占位，凭证变空字符串。
      - name: OTA 版：去掉云同步凭证并重新归档
        working-directory: src
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          grep -q '#include? "Secrets.local.xcconfig"' Config/Secrets.xcconfig \
            || { echo "::error::Secrets.xcconfig 的 include 结构变了，置空方案失效，拒绝继续"; exit 1; }
          rm -f Config/Secrets.local.xcconfig

          rm -rf build-ota && mkdir -p build-ota
          set +e
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build-ota/ota.xcarchive archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" > build-ota.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::OTA 版归档失败"
            grep -oE '[^ /]+\.(swift|m|mm|h|c|cc|cpp):[0-9]+:[0-9]+: error' build-ota.log | sort -u | head -20 || true
            rm -f build-ota.log
            exit 1
          fi
          rm -f build-ota.log
          echo "OTA 版归档通过"

      - name: OTA 版：导出并校验凭证已清空
        working-directory: src
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > exportOptions-ota.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build-ota/ota.xcarchive \
            -exportPath build-ota -exportOptionsPlist exportOptions-ota.plist > export-ota.log 2>&1 || {
              echo "::error::OTA 版导出失败"; tail -20 export-ota.log; exit 1; }
          IPA=$(ls "$PWD"/build-ota/*.ipa | head -1)
          ls -lh "$IPA"

          rm -rf chk-ota && mkdir chk-ota && cd chk-ota
          unzip -q "$IPA"
          APP=$(find Payload -maxdepth 1 -name "*.app" | head -1)

          # 硬护栏：这两个值为空才允许上传公开位置。宁可 CI 红一次，
          # 也不能把带真实密钥的包推到全网可下载的 Release。
          AK=$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb")).get("BOCosAK","") or "")' "$APP/Info.plist")
          SK=$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb")).get("BOCosSK","") or "")' "$APP/Info.plist")
          if [ -n "$AK" ] || [ -n "$SK" ]; then
            echo "::error::OTA 包里的云同步凭证没被清空（AK 长度 ${#AK}），拒绝上传公开仓库"
            exit 1
          fi
          echo "护栏通过：BOCosAK / BOCosSK 均为空"
          codesign --verify --strict --verbose=2 "$APP" 2>&1 | tail -2

      - name: OTA 版：上传公开 Release
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.SRC_PAT }}
        run: |
          set -euo pipefail
          IPA=$(ls "$PWD"/build-ota/*.ipa | head -1)
          OTA_NAME="BigOrderMonitor-ota-${APP_VER}-b${APP_BUILD}.ipa"
          cp "$IPA" "$RUNNER_TEMP/$OTA_NAME"

          echo "OTA_FILE=$OTA_NAME" >> "$GITHUB_ENV"
          echo "OTA_SIZE=$(stat -f%z "$RUNNER_TEMP/$OTA_NAME")" >> "$GITHUB_ENV"
          echo "OTA_SHA=$(shasum -a 256 "$RUNNER_TEMP/$OTA_NAME" | cut -d' ' -f1)" >> "$GITHUB_ENV"

          gh release view ota -R "$OTA_REPO" > /dev/null 2>&1 \
            || gh release create ota -R "$OTA_REPO" --title "OTA 测试版（公开分发）" \
                 --notes "OTA 专用包：云同步凭证已置空，其余功能与完整版一致。完整版见各自私有仓库的 ci-signed。" > /dev/null
          OLD=$(gh release view ota -R "$OTA_REPO" --json assets -q '.assets[].name' 2>/dev/null \
                | grep -E '^BigOrderMonitor-ota-' || true)
          for n in $OLD; do
            gh release delete-asset ota "$n" -R "$OTA_REPO" --yes > /dev/null 2>&1 || true
          done
          gh release upload ota "$RUNNER_TEMP/$OTA_NAME" -R "$OTA_REPO" --clobber
          echo "已上传 $OTA_NAME 到 $OTA_REPO Release ota"

      - name: OTA 版：更新安装页与 manifest
        env:
          GH_TOKEN: ${{ secrets.SRC_PAT }}
        run: |
          set -euo pipefail
          SLUG=bigorder-ios
          SITE="$RUNNER_TEMP/site"
          IPA_URL="https://github.com/${OTA_REPO}/releases/download/ota/${OTA_FILE}"

          rm -rf "$SITE"
          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OTA_REPO}.git" "$SITE"
          cd "$SITE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "docs/$SLUG"

          # 清单与 manifest.plist 都由 tools/ota_json.py 生成（脚本随站点一起提交，
          # 本地能跑、CI 只负责调用）。它读同目录的 notes.json 取发版说明，
          # 并把上一条 latest 挤进 history（最多 8 条）。
          python3 tools/ota_json.py --site docs --slug "$SLUG" \
            --name "大单监控" --label "标准版" \
            --subtitle "自选股大单监控（原始 iOS 版）" \
            --bundle-id "$BUNDLE_ID" --version "$APP_VER" --build "$APP_BUILD" \
            --ipa-url "$IPA_URL" --size "${OTA_SIZE:-0}" --sha256 "$OTA_SHA" \
            --profile-name "$PROFILE_NAME" --devices "${DEVICES:-0}" \
            --expires "${PROFILE_EXPIRES:-}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # 站点是 main/docs，GitHub Pages 直接吃这个目录
          git add "docs/$SLUG"
          if git diff --cached --quiet; then
            echo "站点内容无变化，跳过提交"
          else
            git commit -q -m "chore(ota): bigorder-ios ${APP_VER} (b${APP_BUILD}) [skip ci]"
            pushed=0
            for i in 1 2 3; do
              if git push --quiet origin HEAD:main; then pushed=1; break; fi
              echo "推送冲突，rebase 后重试（第 $i 次）"
              git pull --rebase --quiet origin main || true
            done
            [ "$pushed" = "1" ] || { echo "::error::安装页推送失败，可能被并发构建抢占"; exit 1; }
            echo "安装页已更新：https://${OTA_REPO%%/*}.github.io/${OTA_REPO##*/}/"
          fi

      - name: 摘要
        if: always()
        run: |
          {
            echo "## 大单监控 签名包"
            echo ""
            echo "- 版本：\`${APP_VER:-?}\` (build \`${APP_BUILD:-?}\`)"
            echo "- 构建方式：public 仓库 Actions（不占私有仓库额度）"
            echo ""
            echo "| 内容 | 位置 | 能不能公开 |"
            echo "|---|---|---|"
            echo "| ipa（含云同步凭证） | \`$SRC_REPO\` Release \`ci-signed\` | 否，私有 |"
            echo "| ipa（凭证已置空） | OTA Release \`ota\` | 是，供安装页 |"
            echo ""
            echo "- 完整版下载后用 Apple Configurator / Xcode 装到描述文件登记的设备"
            echo "- OTA 安装页：https://${OTA_REPO%%/*}.github.io/${OTA_REPO##*/}/"
            echo "- ⚠️ OTA 版云同步不可用；要云同步请用私有 Release 的完整版"
          } >> "$GITHUB_STEP_SUMMARY"
