name: build-glasses-signed

# 在 public 仓库（免 CI 额度、日志可审计）里构建私有项目 glasses-quote-ios 并签出可装机 ipa。
# 源码 checkout 到临时目录、ipa 直接传回私有仓库 Release：源码与产物都不留在本仓库。
#
# ★ 签名复用已有的 bigorder 描述文件（secret PROFILE_BIGORDER_B64），它绑定
#   com.bigorder.monitor。因此构建期必须把 bundle id 覆盖成同一个值，否则 Manual
#   签名会报 provisioning profile doesn't match bundle identifier。
#   代价：装到真机会覆盖正式「大单监控」App（demo 本地仍是 com.bigorder.glassesdemo）。
#   要独立安装，需为 com.bigorder.glassesdemo 新建描述文件、配成新 secret，
#   并同步修改下面 env.BUNDLE_ID 与 exportOptions 的 provisioningProfiles。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 私有仓库的分支名或 tag
        required: false
        default: main
      clean_credentials:
        description: 清空云同步凭证（公开发布的包必须保持开启）
        required: false
        default: true
        type: boolean
  # 本文件自身变更时也跑一次，便于提交即验证链路
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-glasses-signed.yml'

concurrency:
  group: glasses-signed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 本仓库只读；推 ipa 用 SRC_PAT 打到私有仓库，不走 GITHUB_TOKEN

env:
  SRC_REPO: summysummy-collab/glasses-quote-ios
  BUNDLE_ID: com.bigorder.monitor
  KEYCHAIN: build.keychain
  KC_PASS: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    # 2026-11-11 下午 macos-15 池连续两次排队 15 分钟仍拿不到 runner，
    # job 被 GitHub 以 cancelled 结束（steps 一条都没跑）。换池绕开拥堵。
    # macos-14 镜像同样带 Xcode 16（支持 Swift 6 的 internal import）。
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: 拉取私有源码
        uses: actions/checkout@v4
        with:
          repository: summysummy-collab/glasses-quote-ios
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.SRC_PAT }}
          path: src
          persist-credentials: false # 别把 token 写进 .git/config

      - name: 选择最新 Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $(basename "$XCODE_APP")"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: 安装 XcodeGen 并生成工程
        working-directory: src
        env:
          BOCOS_AK: ${{ secrets.BOCOS_AK }}
          BOCOS_SK: ${{ secrets.BOCOS_SK }}
          CLEAN: ${{ inputs.clean_credentials }}
        run: |
          brew install xcodegen
          # ★ 公开发布的包必须清空凭证：project.yml 会把 $(BOCOS_AK) 写进 Info.plist，
          #   带凭证的 ipa 托管到公开安装页等于把 COS key 送出去。
          #   只有 dispatch 里显式选 clean_credentials=false 才注入真值。
          #   push 触发时 inputs 为空，也走清空分支（安全默认）。
          mkdir -p Config
          if [ "$CLEAN" = "false" ]; then AK="$BOCOS_AK"; SK="$BOCOS_SK"; else AK=""; SK=""; fi
          {
            echo "BOCOS_AK=${AK}"
            echo "BOCOS_SK=${SK}"
          } > Config/Secrets.local.xcconfig
          if [ -z "$AK" ]; then
            echo "云同步凭证留空（公开发布包）；App 走「云同步不可用」分支，不影响出包"
          fi
          xcodegen generate

          # 官方 CXR-L SDK 用本地 :path pod 集成（RGCxrClient 不在公共 trunk）。
          # 顺序不能反：先 xcodegen 生成 xcodeproj，再 pod install 生成 xcworkspace。
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod --version
          pod install
          test -d BigOrderMonitor.xcworkspace || { echo "::error::pod install 未生成 xcworkspace"; exit 1; }

          # CocoaPods 会替换 target 的 baseConfigurationReference，
          # 使 Config/Secrets.xcconfig 的 BOCOS_* 变量失效（Info.plist 会留下字面量）。
          # 显式把变量补写进 Pods 的 xcconfig，保证展开为预期值。
          find "Pods/Target Support Files/Pods-BigOrderMonitor" -name "*.xcconfig" -print0 \
            | while IFS= read -r -d '' XC; do
                printf '\nBOCOS_AK = %s\nBOCOS_SK = %s\nBOCOS_BUCKET = bigorder-sync-1259316772\nBOCOS_REGION = ap-guangzhou\n' "$AK" "$SK" >> "$XC"
              done
          echo "Pods 已就绪，SDK 已集成"

      # 所有打印都刻意不输出证书 CN / TeamID / 描述文件 UUID / 设备列表：
      # 本仓库日志对全网公开。完整编译日志可用带认证的 Actions API 在本地拉取分析。
      - name: 导入签名证书
        env:
          CERT_B64: ${{ secrets.CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_B64" | openssl base64 -d -A -out "$CERT_PATH"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          rm -f "$CERT_PATH"

          N=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Development" || true)
          echo "可用 Apple Development 身份数: $N"
          [ "$N" -ge 1 ] || { echo "::error::钥匙串里没有 Apple Development 身份"; exit 1; }

      - name: 安装描述文件
        env:
          PROFILE_B64: ${{ secrets.PROFILE_BIGORDER_B64 }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_B64" | openssl base64 -d -A -out "$PROFILE"

          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "描述文件已安装（UUID 不打印）"

      - name: Archive
        working-directory: src
        run: |
          set -o pipefail
          set +e
          # 签名设置全部在 project.yml 的 Release 配置里（只作用于主 target）。
          # 命令行不再传任何签名参数，避免污染 Pods framework。
          xcodebuild -workspace BigOrderMonitor.xcworkspace -scheme BigOrderMonitor \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/BigOrderMonitor.xcarchive archive > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::归档失败（日志已脱敏，仅输出出错位置）"
            echo "错误总数: $(grep -c 'error:' build.log || echo 0)"
            grep -oE '[^ /]+\.(swift|m|mm|h|c|cc|cpp):[0-9]+:[0-9]+: error' build.log \
              | sort -u | head -25 || true
            rm -f build.log
            exit 1
          fi
          rm -f build.log
          echo "归档通过"

      - name: Export ipa
        working-directory: src
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>bigorder</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/BigOrderMonitor.xcarchive \
            -exportPath build -exportOptionsPlist exportOptions.plist > export.log 2>&1 || {
              echo "::error::导出失败"; tail -20 export.log; exit 1; }
          ls -lh build/*.ipa
          echo "sha256: $(shasum -a 256 build/*.ipa | cut -d' ' -f1)"

      - name: 校验签名
        working-directory: src
        run: |
          set -euo pipefail
          rm -rf chk && mkdir chk && cd chk
          unzip -q ../build/*.ipa
          APP=$(find Payload -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --strict --verbose=2 "$APP" 2>&1 | tail -3
          test -f "$APP/embedded.mobileprovision" || { echo "::error::包内缺描述文件"; exit 1; }
          # ★ 真机通道的硬证据：canImport(RGCxrClient) 成立才会链接这个 framework
          find "$APP/Frameworks" -maxdepth 1 -name "RGCxrClient.framework" | grep -q . \
            || { echo "::error::包内缺 RGCxrClient.framework，真机通道未编入"; exit 1; }
          echo "CXR-L SDK 已内嵌（真机桥接可用）"
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          echo "Bundle ID: $BID"
          echo "体积: $(du -sh "$APP" | cut -f1)"
          echo "登记设备数: $(security cms -D -i "$APP/embedded.mobileprovision" \
            | plutil -extract ProvisionedDevices json -o - - 2>/dev/null | grep -o '"' | wc -l | awk '{print $1/2}')"

      - name: 校验公开包无明文凭证
        working-directory: src
        run: |
          set -euo pipefail
          unzip -p build/*.ipa Payload/BigOrderMonitor.app/Info.plist > "$RUNNER_TEMP/info.plist"
          AK=$(plutil -extract BOCosAK raw "$RUNNER_TEMP/info.plist" 2>/dev/null || true)
          # 也要抓「$(BOCOS_AK) 未展开」这种字面量，避免 CocoaPods 覆盖 xcconfig 后漏掉
          if printf '%s' "$AK" | grep -qE 'AKID|\$\('; then
            echo "::error::包内含明文凭证或未展开变量，禁止公开发布"
            exit 1
          fi
          echo "包内凭证字段为空，可用于公开发布安装页"

      # ipa 不落到本仓库的 Release/artifact（public 全网可下载），
      # 走 SRC_PAT 传到私有仓库的 ci-signed，下载仍需登录授权。
      - name: 传到私有仓库 Release
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.SRC_PAT }}
        run: |
          set -euo pipefail
          IPA=$(ls build/*.ipa | head -1)
          gh release view ci-signed -R "$SRC_REPO" > /dev/null 2>&1 \
            || gh release create ci-signed -R "$SRC_REPO" \
                 --title "CI 已签名包（自动覆盖）" --notes "由 public 仓库 Actions 构建" > /dev/null
          gh release upload ci-signed "$IPA" -R "$SRC_REPO" --clobber
          echo "已上传 $(basename "$IPA") 到 $SRC_REPO Release ci-signed"

      - name: 摘要
        if: always()
        run: |
          {
            echo "## 眼镜行情 demo 签名包"
            echo ""
            echo "- 构建方式：public 仓库 Actions（不占私有仓库额度）"
            echo "- 源码：私有仓库 \`$SRC_REPO\`（临时目录 checkout，源码不进公开日志）"
            echo "- 签名：复用 bigorder 描述文件，bundle id 构建期覆盖为 \`$BUNDLE_ID\`"
            echo "- 产物去向：私有仓库 Release \`ci-signed\`（公开日志里看不到 ipa）"
            echo "- ⚠️ 安装到真机会覆盖同 bundle id 的正式大单监控 App"
          } >> "$GITHUB_STEP_SUMMARY"
