name: build-bigorder

# 在 public 仓库里构建私有项目。源码不落盘、不入库、不进日志。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 私有仓库的分支名或 tag
        required: false
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: 拉取私有源码
        uses: actions/checkout@v4
        with:
          repository: summysummy-collab/bigorder-ios
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SRC_PAT }}
          path: src

      - name: 环境信息
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app | sed 's#.*/##'

      - name: 选最新 Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $(basename "$XCODE_APP")"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        working-directory: src
        run: |
          xcodegen generate
          echo "源文件数: $(find . -name '*.swift' | wc -l | tr -d ' ')"

      # 失败时不打印 build.log：编译错误行会带出源码原文，而本仓库日志是公开的。
      # 只输出「出错位置的文件名:行:列」，够定位，不泄内容。
      - name: 编译（模拟器，不签名）
        working-directory: src
        run: |
          set +e
          xcodebuild -project BigOrderMonitor.xcodeproj -scheme BigOrderMonitor \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Release CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::编译失败（日志已脱敏，仅输出出错位置）"
            echo "错误总数: $(grep -c 'error:' build.log || echo 0)"
            echo "--- 出错位置 ---"
            grep -oE '[^ /]+\.(swift|m|mm|h|c|cc|cpp):[0-9]+:[0-9]+: error' build.log \
              | sort -u | head -25 || true
            rm -f build.log
            exit 1
          fi
          rm -f build.log
          echo "编译通过"

      - name: 产物
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d \
                -path "*/Build/Products/Release-iphonesimulator/BigOrderMonitor.app" 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "产物大小: $(du -sh "$APP" | cut -f1)"
            echo "架构: $(lipo -archs "$APP/BigOrderMonitor" 2>/dev/null || echo unknown)"
          else
            echo "未找到产物"
          fi
