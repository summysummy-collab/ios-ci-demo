name: build-caddie-bridge

# 在 public 仓库（免额度、日志可审计）里构建私有项目 rokid-caddie 的 iPhone 端定位桥，
# 签出可装机 ipa 后回传私有仓库 Release ci-signed。
#
# 与 build-glasses-signed.yml 的差别：
#   - 不使用 PROFILE_BIGORDER_B64；描述文件随源码放在 phone-app/signing/ 里
#     （mobileprovision 不含私钥，设备 UDID 只在私有仓库，公开日志不打印）
#   - bundle id 精确匹配 com.rokidcaddie.bridge，无通配，必须与 profile 一致
#   - 无 CocoaPods、无外部 SDK，纯系统框架（CoreLocation / Network / SwiftUI）
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 私有仓库的分支名或 tag
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-caddie-bridge.yml'

permissions:
  contents: read # 本仓库只读；ipa 用 SRC_PAT 推到私有仓库

env:
  SRC_REPO: summysummy-collab/rokid-caddie
  APP_DIR: rokid-caddie-bridge/phone-app
  SCHEME: CaddieBridge
  BUNDLE_ID: com.rokidcaddie.bridge
  PROFILE_NAME: rokid-caddie-bridge
  TEAM_ID: VWRHBYFR25
  KEYCHAIN: build.keychain
  KC_PASS: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 拉取私有源码
        uses: actions/checkout@v4
        with:
          repository: summysummy-collab/rokid-caddie
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.SRC_PAT }}
          path: src
          persist-credentials: false

      - name: 选择最新 Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $(basename "$XCODE_APP")"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: 生成工程
        working-directory: src/rokid-caddie-bridge/phone-app
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          test -d CaddieBridge.xcodeproj || { echo "::error::xcodegen 未生成工程"; exit 1; }
          echo "工程已生成"

      - name: 导入签名证书
        env:
          CERT_B64: ${{ secrets.CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_B64" | openssl base64 -d -A -out "$CERT_PATH"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          rm -f "$CERT_PATH"

          N=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Development" || true)
          echo "可用 Apple Development 身份数: $N"
          [ "$N" -ge 1 ] || { echo "::error::钥匙串里没有 Apple Development 身份"; exit 1; }

      - name: 安装描述文件
        run: |
          set -euo pipefail
          PROFILE="src/$APP_DIR/signing/$PROFILE_NAME.mobileprovision"
          test -f "$PROFILE" || { echo "::error::仓库里没有 $PROFILE"; exit 1; }

          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)
          NAME=$(security cms -D -i "$PROFILE" | plutil -extract Name raw -o - -)
          BID=$(security cms -D -i "$PROFILE" | plutil -extract Entitlements.application-identifier raw -o - -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          # 描述文件里的 App ID 必须与工程一致，否则 Manual 签名会直接失败
          case "$BID" in
            *".$BUNDLE_ID") echo "描述文件匹配 $BUNDLE_ID" ;;
            *) echo "::error::描述文件的 App ID 与 $BUNDLE_ID 不一致"; exit 1 ;;
          esac
          # set -u 下 `$NAME（` 会把全角括号算进变量名 → unbound variable，必须用 ${}
          echo "描述文件已安装：${NAME}（UUID 不打印）"

      - name: Archive
        working-directory: src/rokid-caddie-bridge/phone-app
        run: |
          set -o pipefail
          set +e
          xcodebuild -project CaddieBridge.xcodeproj -scheme "$SCHEME" \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/CaddieBridge.xcarchive archive > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::归档失败（日志已脱敏，仅输出出错位置）"
            echo "错误总数: $(grep -c 'error:' build.log || echo 0)"
            grep -oE '[^ /]+\.(swift|m|h):[0-9]+:[0-9]+: error' build.log | sort -u | head -25 || true
            # 签名类错误没有文件名前缀，单独捞一行上下文，便于判断是证书还是 profile
            grep -iE "provisioning profile|does not match|no signing certificate|requires a development team" build.log | head -6 || true
            rm -f build.log
            exit 1
          fi
          rm -f build.log
          echo "归档通过"

      - name: Export ipa
        working-directory: src/rokid-caddie-bridge/phone-app
        run: |
          set -o pipefail
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/CaddieBridge.xcarchive \
            -exportPath build -exportOptionsPlist exportOptions.plist > export.log 2>&1 || {
              echo "::error::导出失败"; tail -20 export.log; exit 1; }
          ls -lh build/*.ipa
          echo "sha256: $(shasum -a 256 build/*.ipa | cut -d' ' -f1)"

      - name: 校验签名
        working-directory: src/rokid-caddie-bridge/phone-app
        run: |
          set -euo pipefail
          rm -rf chk && mkdir chk && cd chk
          unzip -q ../build/*.ipa
          APP=$(find Payload -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --strict --verbose=2 "$APP" 2>&1 | tail -3
          test -f "$APP/embedded.mobileprovision" || { echo "::error::包内缺描述文件"; exit 1; }
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          [ "$BID" = "$BUNDLE_ID" ] || { echo "::error::Bundle ID 是 $BID，应为 $BUNDLE_ID"; exit 1; }
          # 后台定位是这 App 的核心，缺了这个键等于白装
          plutil -extract UIBackgroundModes.0 raw "$APP/Info.plist" | grep -qx location \
            || { echo "::error::包内缺 UIBackgroundModes: location"; exit 1; }
          echo "Bundle ID: $BID · 后台定位已声明"
          echo "体积: $(du -sh "$APP" | cut -f1)"
          echo "登记设备数: $(security cms -D -i "$APP/embedded.mobileprovision" \
            | plutil -extract ProvisionedDevices json -o - - 2>/dev/null | grep -o '"' | wc -l | awk '{print $1/2}')"

      - name: 传到私有仓库 Release
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.SRC_PAT }}
        run: |
          set -euo pipefail
          IPA=$(ls rokid-caddie-bridge/phone-app/build/*.ipa | head -1)
          OUT="CaddieBridge-$(date +%Y%m%d-%H%M).ipa"
          cp "$IPA" "$RUNNER_TEMP/$OUT"
          gh release view ci-signed -R "$SRC_REPO" > /dev/null 2>&1 \
            || gh release create ci-signed -R "$SRC_REPO" \
                 --title "CI 已签名包（自动覆盖）" --notes "由 public 仓库 Actions 构建" > /dev/null
          gh release upload ci-signed "$RUNNER_TEMP/$OUT" -R "$SRC_REPO" --clobber
          echo "已上传 $OUT 到 $SRC_REPO Release ci-signed"

      - name: 摘要
        if: always()
        run: |
          {
            echo "## 球童桥 · iPhone 端签名包"
            echo ""
            echo "- 源码：私有仓库 \`${SRC_REPO}\`（\`${APP_DIR}\`）"
            echo "- 签名：development 描述文件 \`${PROFILE_NAME}\`，bundle id \`${BUNDLE_ID}\`"
            echo "- 产物：私有仓库 Release \`ci-signed\`"
            echo "- 装机前提：设备必须在描述文件的登记列表里"
          } >> "$GITHUB_STEP_SUMMARY"
