name: build-golf-caddie
# trigger: 1.2 (3) —— 修 cxrl 回调 scheme

# 在 public 仓库（免额度、日志可审计）里构建私有项目 rokid-caddie 的 AI 球童 iOS 端，
# 签出可装机 ipa 回传私有仓库 Release ci-signed。
#
# 与 build-caddie-bridge.yml 的关系：同一个 App ID（com.rokidcaddie.bridge）、
# 同一份 development 描述文件（rokid-caddie-bridge.mobileprovision）。
# 因此两个 App 装到同一台设备上会互相覆盖 —— 只能留一个。
#
# 与 build-caddie-bridge.yml 的差别：
#   - 需要 CocoaPods：CXR-L SDK 以本地 pod 形式 vendor 在 golf-caddie/ios/modules/
#   - 产物含 RGCxrClient.framework，才能走 BLE 连真眼镜（否则 canImport 不成立、退回 Mock）
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 私有仓库的分支名或 tag
        required: false
        default: main
      runner:
        description: runner label（macos-15 或 macos-15-intel）
        required: false
        default: macos-15-intel
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-golf-caddie.yml'

permissions:
  contents: read # 本仓库只读；ipa 用 SRC_PAT 推到私有仓库

env:
  SRC_REPO: summysummy-collab/rokid-caddie
  APP_DIR: golf-caddie/ios
  SCHEME: GolfCaddie
  BUNDLE_ID: com.rokidcaddie.bridge
  PROFILE_FILE: golf-caddie/ios/signing/rokid-caddie-bridge.mobileprovision
  PROFILE_NAME: rokid-caddie-bridge
  TEAM_ID: VWRHBYFR25
  KEYCHAIN: build.keychain
  KC_PASS: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    # 免费账号跑 public 仓库的 macOS job 优先级最低，池子紧张时会一直 queued，
    # 约 15 分钟被 GitHub 直接 cancelled（零 step）。
    # 对策：label 做成入参，可在 macos-15 / macos-15-intel 两个池子并行派发抢机器。
    # 两者都是同版本 macOS 15，构建行为一致。
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 40
    steps:
      - name: 拉取私有源码
        uses: actions/checkout@v4
        with:
          repository: summysummy-collab/rokid-caddie
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.SRC_PAT }}
          path: src
          persist-credentials: false

      - name: 选择最新 Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $(basename "$XCODE_APP")"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: 生成工程并装 Pod
        working-directory: src/golf-caddie/ios
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          test -d GolfCaddie.xcodeproj || { echo "::error::xcodegen 未生成工程"; exit 1; }

          # CXR-L SDK 不在公共 CocoaPods（官方 spec 在 Rokid 内网 GitLab），
          # 以本地 :path pod 形式 vendor 在 modules/，必须 pod install 才能编进真机通道。
          test -d modules/RGCxr || { echo "::error::缺 modules/RGCxr，CXR SDK 未入库"; exit 1; }
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod --version
          pod install --verbose 2>&1 | tail -40 || {
            echo "::error::pod install 失败"; tail -40 Podfile; exit 1; }
          test -d GolfCaddie.xcworkspace || { echo "::error::pod install 未生成 xcworkspace"; exit 1; }
          echo "工程与 Pods 已就绪"

      - name: 导入签名证书
        env:
          CERT_B64: ${{ secrets.CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_B64" | openssl base64 -d -A -out "$CERT_PATH"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          rm -f "$CERT_PATH"

          N=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Development" || true)
          echo "可用 Apple Development 身份数: $N"
          [ "$N" -ge 1 ] || { echo "::error::钥匙串里没有 Apple Development 身份"; exit 1; }

      - name: 安装描述文件
        run: |
          set -euo pipefail
          PROFILE="src/$PROFILE_FILE"
          test -f "$PROFILE" || { echo "::error::仓库里没有 $PROFILE"; exit 1; }

          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)
          BID=$(security cms -D -i "$PROFILE" | plutil -extract Entitlements.application-identifier raw -o - -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          case "$BID" in
            *".$BUNDLE_ID") echo "描述文件匹配 $BUNDLE_ID" ;;
            *) echo "::error::描述文件的 App ID($BID) 与 $BUNDLE_ID 不一致"; exit 1 ;;
          esac

      - name: Archive
        working-directory: src/golf-caddie/ios
        run: |
          set -o pipefail
          set +e
          # 签名设置全在 project.yml 里（只作用于主 target），命令行不传签名参数，
          # 避免污染 Pods 的 framework。
          xcodebuild -workspace GolfCaddie.xcworkspace -scheme "$SCHEME" \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/GolfCaddie.xcarchive archive > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::归档失败（日志已脱敏，仅输出出错位置）"
            echo "错误总数: $(grep -c 'error:' build.log || echo 0)"
            grep -E 'error:' build.log | sed -E 's#/Users/[^ ]*/src/#src/#g' | sort -u | head -40 || true
            echo "=== 签名相关 ==="
            grep -iE "provisioning profile|does not match|no signing certificate|requires a development team" build.log | head -8 || true
            echo "=== 尾部 ==="
            tail -25 build.log
            exit 1
          fi
          rm -f build.log
          echo "归档通过"

      - name: Export ipa
        working-directory: src/golf-caddie/ios
        run: |
          set -o pipefail
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/GolfCaddie.xcarchive \
            -exportPath build -exportOptionsPlist exportOptions.plist > export.log 2>&1 || {
              echo "::error::导出失败"; tail -25 export.log; exit 1; }
          ls -lh build/*.ipa
          echo "sha256: $(shasum -a 256 build/*.ipa | cut -d' ' -f1)"

      - name: 校验签名与 SDK 内嵌
        working-directory: src/golf-caddie/ios
        run: |
          set -euo pipefail
          rm -rf chk && mkdir chk && cd chk
          unzip -q ../build/*.ipa
          APP=$(find Payload -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --strict --verbose=2 "$APP" 2>&1 | tail -3
          test -f "$APP/embedded.mobileprovision" || { echo "::error::包内缺描述文件"; exit 1; }
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          [ "$BID" = "$BUNDLE_ID" ] || { echo "::error::Bundle ID 是 $BID，应为 $BUNDLE_ID"; exit 1; }

          # 真机通道的硬证据：canImport(RGCxrClient) 成立才会把它链进包
          find "$APP/Frameworks" -maxdepth 1 -name "RGCxrClient.framework" | grep -q . \
            || { echo "::error::包内缺 RGCxrClient.framework，CXR 真机通道没编进去（会退回 Mock）"; exit 1; }
          echo "CXR-L SDK 已内嵌（可连真眼镜）"

          # BLE 连眼镜必须有的权限键，缺了会在授权后直接 SIGABRT
          plutil -extract NSBluetoothAlwaysUsageDescription raw "$APP/Info.plist" > /dev/null \
            || { echo "::error::缺 NSBluetoothAlwaysUsageDescription"; exit 1; }
          # 眼镜端 APK 要随包分发，iOS 端用它推给眼镜安装
          test -f "$APP/glasses.apk" || { echo "::error::缺内置眼镜端 APK"; exit 1; }

          echo "Bundle ID: $BID · 蓝牙权限已声明 · 眼镜端 APK 已内置"
          echo "体积: $(du -sh "$APP" | cut -f1)"
          echo "登记设备数: $(security cms -D -i "$APP/embedded.mobileprovision" \
            | plutil -extract ProvisionedDevices json -o - - 2>/dev/null | grep -o '"' | wc -l | awk '{print $1/2}')"

      - name: 传到私有仓库 Release
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.SRC_PAT }}
        run: |
          set -euo pipefail
          IPA=$(ls golf-caddie/ios/build/*.ipa | head -1)
          OUT="GolfCaddie-$(date +%Y%m%d-%H%M).ipa"
          cp "$IPA" "$RUNNER_TEMP/$OUT"
          gh release view ci-signed -R "$SRC_REPO" > /dev/null 2>&1 \
            || gh release create ci-signed -R "$SRC_REPO" \
                 --title "CI 已签名包（自动覆盖）" --notes "由 public 仓库 Actions 构建" > /dev/null
          gh release upload ci-signed "$RUNNER_TEMP/$OUT" -R "$SRC_REPO" --clobber
          echo "已上传 $OUT 到 $SRC_REPO Release ci-signed"

      - name: 摘要
        if: always()
        run: |
          {
            echo "## AI 球童 · iOS 签名包"
            echo ""
            echo "- 源码：私有仓库 \`${SRC_REPO}\`（\`${APP_DIR}\`）"
            echo "- 签名：development 描述文件 \`${PROFILE_NAME}\`，bundle id \`${BUNDLE_ID}\`"
            echo "- 含 CXR-L SDK（本地 pod），可 BLE 连真眼镜"
            echo "- 产物：私有仓库 Release \`ci-signed\`"
            echo "- 装机前提：设备必须在描述文件登记列表里"
            echo "- ⚠️ 与「球童桥」同 App ID，装这个会覆盖它"
          } >> "$GITHUB_STEP_SUMMARY"
